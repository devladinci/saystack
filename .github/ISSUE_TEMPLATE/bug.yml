name: Bug report
description: Something in a saystack package does not work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@saystack/react-web 0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Smallest steps to reproduce
      description: A snippet or a link to a small repo helps most.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or platform, and the speech engine
      placeholder: "Safari 26 on macOS, OpenAI"
