name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # No npm token: each package trusts this workflow (npm trusted publishing), so the publish
      # authenticates with the job's OIDC token (id-token: write) and gets provenance.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          pr-title: Version packages
          commit-message: Version packages
        env:
          NPM_CONFIG_PROVENANCE: true
